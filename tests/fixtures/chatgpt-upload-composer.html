    <div data-composer-layout="multiline" role="presentation">
      <div class="relative">
        <input class="hidden" accept="image/*" aria-label="Take a photo" capture="environment" type="file">
        <input accept="image/*,video/*" aria-label="Attach photos or videos" class="hidden" multiple type="file">
        <input class="hidden" accept="image/*" aria-label="Attach photos" multiple type="file">
        <input class="hidden" aria-label="Attach files" multiple type="file">
        <div data-composer-body="">
          <div class="contents"><div data-composer-attachments=""></div></div>
          <div data-composer-footer-responsive="">
            <div data-composer-input="">
              <div contenteditable="true" aria-multiline="true" role="textbox" class="ProseMirror" data-composer-markdown="" aria-label="Ask ChatGPT"><p></p></div>
            </div>
            <button type="button" aria-label="Add files and more" aria-expanded="false" data-composer-navigation-target="add-context" data-state="closed"></button>
            <button type="submit" aria-label="Send"></button>
          </div>
        </div>
      </div>
    </div>
  </div></div>
</form>
